split:
  mode: random
  ratio: 0.1
  min_items: 3
  seed: 42
eval:
  k: 20
  test_users_only: true
params:
  components:
  - model: cease
    weight: 1.0
    params:
      reg: 250.0
      tau_days: 365
      reg_pop: 0.3
      alpha: 5.0
      beta: 3.0
      pos_gamma: 0.05
      pos_bin: 12
  - model: fileorder
    weight: 0.25
    params:
      window: 50
      kernel: gauss
      sigma: 20
  - model: textsim
    weight: 0.1
    params:
      source: tfidf
      field: text
      k: 50
  - model: itemknn
    weight: 0.3
    params:
      k: 100
      shrink: 10.0
  - model: affinity
    weight: 0.2
    params:
      attr: leaf
  - model: textsim
    weight: 0.1
    params:
      source: tfidf
      field: title
      k: 50
  - model: affinity
    weight: 0.05
    params:
      attr: path
model: blend
