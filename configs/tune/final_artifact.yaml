# 최종 blend (Artifact 사용): marginal 실험에서 효과가 있던 component만 넣고 coordinate descent
components:
  ease:        {model: ease, params: {reg: 500.0, max_items: null}}
  easetime:    {model: easetime, params: {reg: 500.0, tau_days: 365}}
  easetime180: {model: easetime, params: {reg: 500.0, tau_days: 180}}
  fnbg:        {model: fileorder, params: {window: 50, kernel: gauss, sigma: 20}}
  tfidf:       {model: textsim, params: {source: tfidf, field: text, k: 50}}
  tfidf100:    {model: textsim, params: {source: tfidf, field: text, k: 100}}
  title:       {model: textsim, params: {source: tfidf, field: title, k: 50}}
  itemknn:     {model: itemknn, params: {k: 100, shrink: 10.0}}
  cat:         {model: affinity, params: {attr: leaf}}
  store:       {model: affinity, params: {attr: store}}
  path:        {model: affinity, params: {attr: path}}
evaluate:
  ease+fnbg:          "ease=1,fnbg=0.3"
  ease+fnbg+tfidf.3:  "ease=1,fnbg=0.3,tfidf=0.3"
  ease+fnbg+title.3:  "ease=1,fnbg=0.3,title=0.3"
init: "easetime=1,fnbg=0.3,tfidf=0.15,itemknn=0.3,cat=0.2,store=0.1"
search:
  tfidf:       [0.1, 0.25, 0.35, 0.5]
  title:       [0.1, 0.2, 0.35]
  tfidf100:    [0.1, 0.2]
  fnbg:        [0.2, 0.4, 0.5]
  itemknn:     [0, 0.15, 0.5]
  ease:        [0.5, 1]
  easetime180: [0.5, 1]
  cat:         [0, 0.1, 0.3]
  store:       [0, 0.05, 0.2]
  path:        [0.05, 0.1]
rounds: 2
save_best: configs/blend_best.yaml
