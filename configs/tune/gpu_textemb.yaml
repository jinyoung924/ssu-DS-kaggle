# kaggle/text_embed_gpu.py 결과(data/external/text_emb.npy)만 있을 때 실행 (LightGCN 없이):
#   uv run python -m scripts.tune_blend configs/tune/gpu_textemb.yaml
# configs/blend_best.yaml(valid 0.07052)의 component에 문장 임베딩 유사도를 더해 가중치를 다시 맞춘다.
components:
  easetime:  {model: easetime, params: {reg: 500.0, tau_days: 365}}
  fnbg:      {model: fileorder, params: {window: 50, kernel: gauss, sigma: 20}}
  tfidf:     {model: textsim, params: {source: tfidf, field: text, k: 50}}
  title:     {model: textsim, params: {source: tfidf, field: title, k: 50}}
  itemknn:   {model: itemknn, params: {k: 100, shrink: 10.0}}
  cat:       {model: affinity, params: {attr: leaf}}
  store:     {model: affinity, params: {attr: store}}
  path:      {model: affinity, params: {attr: path}}
  textemb:   {model: textsim, params: {source: emb, emb_path: data/external/text_emb.npy, k: 50}}  # kaggle/text_embed_gpu.py
evaluate:
  only_textemb:  "textemb=1"
  only_tfidf:    "tfidf=1"
init: "easetime=1,fnbg=0.5,tfidf=0.25,itemknn=0.3,cat=0.2,store=0.2,title=0.1,path=0.05"
search:
  textemb:  [0.05, 0.1, 0.2, 0.3, 0.5]
  tfidf:    [0.1, 0.2, 0.3]
  title:    [0, 0.05, 0.2]
  itemknn:  [0.15, 0.3, 0.5]
  fnbg:     [0.3, 0.5, 0.7]
rounds: 2
save_best: configs/blend_textemb.yaml
