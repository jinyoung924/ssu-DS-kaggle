[project]
name = "ssu-ds-kaggle"
version = "0.1.0"
description = "SSU Data Science - Amazon top-k recommendation (Kaggle)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
notebook = ["jupyterlab>=4.0", "matplotlib>=3.8"]
rerank = [
    "lightgbm>=4.7.0",
]

[tool.uv]
package = false
